[build-system]
requires = [ "poetry-core>=1.2.0" ]
build-backend = "poetry.core.masonry.api"

[tool.poetry-version-plugin]
source = "init"

[tool.poetry]
name = "dubois-osint"
version = "0.20.0"
description = "DuBois: downstream Sherlock fork. Hunt usernames across social networks."
license = "MIT"
authors = [
    "Siddharth Dushantha <siddharth.dushantha@gmail.com>"
]
readme = "README.md"
packages = [ { include = "dubois"} ]
keywords = [ "osint", "reconnaissance", "information gathering", "dubois", "sherlock" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security"
]

[tool.poetry.dependencies]
python = "^3.9"
certifi = ">=2019.6.16"
colorama = "^0.4.1"
PySocks = "^1.7.0"
requests = "^2.22.0"
requests-futures = "^1.0.0"
stem = "^1.8.0"
aiohttp = "^3.9.0"
openpyxl = "^3.0.10"
tomli = "^2.2.1"
jsonschema = "^4.0.0"
holehe = { version = "*", optional = true }
ignorant = { version = "*", optional = true }
maigret = { version = "*", optional = true }

[tool.poetry.extras]
email = ["holehe"]
phone = ["ignorant"]
deep = ["maigret"]
full = ["holehe", "ignorant", "maigret"]

[tool.poetry.group.dev.dependencies]
jsonschema = "^4.0.0"
rstr = "^3.2.2"
pytest = "^8.4.2"
pytest-xdist = "^3.8.0"

[tool.poetry.group.ci.dependencies]
defusedxml = "^0.7.1"

[tool.poetry.scripts]
dubois = "dubois.cli:main"
